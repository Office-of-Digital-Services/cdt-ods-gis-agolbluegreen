[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agol_bluegreen/__init__.py"

[project]
name = "agol_bluegreen"
dynamic = ["version"]
dependencies = [
    "arcgis"
]
requires-python = ">=3.11.0"
authors = [{name="Nick Santos"}]
license = {text = "BSD-3-Clause"}
readme = "README.md"

[project.optional-dependencies]
test = [
    "pytest == 8.2.0",
]
lint = [
    "flake8",
    "mypy"
]
dev = [
    "agol_bluegreen[test,lint]",
]